<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warden's Sanctum - Play in Browser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 30px 20px;
        }

        h1 {
            font-size: 2.5em;
            color: #c7a64a;
            text-shadow: 0 0 20px rgba(199, 166, 74, 0.5);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .tagline {
            font-size: 1.1em;
            color: #9b9b9b;
            font-style: italic;
            margin-bottom: 20px;
        }

        .game-container {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #c7a64a;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            margin-bottom: 20px;
        }

        #terminal {
            background: #0a0a0a;
            border: 1px solid #c7a64a;
            border-radius: 5px;
            padding: 15px;
            min-height: 400px;
            max-height: 600px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            color: #00ff00;
            margin-bottom: 15px;
        }

        #terminal::-webkit-scrollbar {
            width: 10px;
        }

        #terminal::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        #terminal::-webkit-scrollbar-thumb {
            background: #c7a64a;
            border-radius: 5px;
        }

        .input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        #userInput {
            flex: 1;
            background: #1a1a1a;
            border: 2px solid #c7a64a;
            border-radius: 5px;
            padding: 10px;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        #userInput:focus {
            outline: none;
            border-color: #d4b15e;
            box-shadow: 0 0 10px rgba(199, 166, 74, 0.3);
        }

        #userInput:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button {
            background: linear-gradient(135deg, #c7a64a 0%, #8b7332 100%);
            color: #1a1a2e;
            padding: 10px 25px;
            font-size: 1em;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Georgia', serif;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(199, 166, 74, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .info {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-size: 0.9em;
            border: 1px solid rgba(199, 166, 74, 0.3);
        }

        .info h3 {
            color: #c7a64a;
            margin-bottom: 10px;
        }

        .info ul {
            margin-left: 20px;
            margin-top: 10px;
        }

        .info li {
            margin: 5px 0;
        }

        .terminal-line {
            margin: 2px 0;
            word-wrap: break-word;
        }

        .user-input-line {
            color: #c7a64a;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }
            
            .input-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Warden's Sanctum</h1>
            <p class="tagline">Play in Your Browser</p>
        </header>

        <div class="game-container">
            <div id="terminal"></div>
            
            <div class="input-container">
                <input 
                    type="text" 
                    id="userInput" 
                    placeholder="Enter your choice..." 
                    autocomplete="off"
                    style="display:none;"
                >
                <button id="submitBtn" style="display:none;">Submit</button>
            </div>

            <div class="controls">
                <button id="startBtn">Start Game</button>
                <button id="restartBtn">Restart</button>
            </div>
        </div>

        <div class="info">
            <h3>How to Play</h3>
            <ul>
                <li>Click "Start Game" to begin your adventure</li>
                <li>Read the story text as it appears</li>
                <li>When prompted, type the number of your choice and press Enter or click Submit</li>
                <li>Click "Restart" at any time to start over</li>
            </ul>
        </div>
    </div>

    <script>
        // Game state
        let gameState = {
            Razor: 0,
            Wand: false,
            door1: false,
            potion1: false,
            timewasted: false,
            scars: false,
            flowers_collected: false,
            water_collected: false,
            infinite_razor_counter: 0,
            powerupgraded: 0
        };

        let isRunning = false;
        let currentScene = null;

        const terminal = document.getElementById('terminal');
        const userInput = document.getElementById('userInput');
        const submitBtn = document.getElementById('submitBtn');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');

        function typeText(text, delay = 50) {
            return new Promise((resolve) => {
                const line = document.createElement('div');
                line.className = 'terminal-line';
                terminal.appendChild(line);
                
                let i = 0;
                const interval = setInterval(() => {
                    if (i < text.length) {
                        line.textContent += text[i];
                        terminal.scrollTop = terminal.scrollHeight;
                        i++;
                    } else {
                        clearInterval(interval);
                        resolve();
                    }
                }, delay);
            });
        }

        function print(text) {
            const line = document.createElement('div');
            line.className = 'terminal-line';
            line.textContent = text;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function printUserInput(text) {
            const line = document.createElement('div');
            line.className = 'terminal-line user-input-line';
            line.textContent = '> ' + text;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function clearTerminal() {
            terminal.innerHTML = '';
        }

        async function getInput(options) {
            return new Promise((resolve) => {
                userInput.style.display = 'block';
                submitBtn.style.display = 'block';
                userInput.disabled = false;
                submitBtn.disabled = false;
                userInput.focus();

                const handler = () => {
                    const value = userInput.value.trim();
                    if (value) {
                        printUserInput(value);
                        userInput.value = '';
                        userInput.style.display = 'none';
                        submitBtn.style.display = 'none';
                        userInput.removeEventListener('keypress', keypressHandler);
                        submitBtn.removeEventListener('click', handler);
                        resolve(value);
                    }
                };

                const keypressHandler = (e) => {
                    if (e.key === 'Enter') {
                        handler();
                    }
                };

                userInput.addEventListener('keypress', keypressHandler);
                submitBtn.addEventListener('click', handler);
            });
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function gameOver() {
            await typeText("Game Over");
            print("");
            isRunning = false;
            startBtn.disabled = false;
        }

        async function runGame() {
            if (isRunning) return;
            
            isRunning = true;
            clearTerminal();
            startBtn.disabled = true;
            restartBtn.disabled = true;
            
            // Reset game state
            gameState = {
                Razor: 0,
                Wand: false,
                door1: false,
                potion1: false,
                timewasted: false,
                scars: false,
                flowers_collected: false,
                water_collected: false,
                infinite_razor_counter: 0,
                powerupgraded: 0
            };

            try {
                await typeText("Welcome to 'Warden's Sanctum', a text-based adventure game");
                print("");
                await typeText("When you are given a choice, type the number associated with the option you would like to choose");
                print("");
                await sleep(2000);
                await typeText("Please do not do so until the options have fully loaded");
                print("");
                await sleep(2000);
                await typeText("Have a good experience");
                print("");
                await sleep(5000);
                await typeText("You awaken in a dark, damp room on a grimy bed");
                await sleep(1000);
                print("");
                await typeText("You see a shelf on the opposite side of the room from where you currently are.");
                await sleep(1000);
                print("");
                await typeText("As you get up from the bed, you see that it is being held up by chains connected to the wall.");
                await sleep(1000);
                print("");
                await typeText("You also see that one wall of the room is made of metal bars.");
                await sleep(1000);
                print("");

                // Main game loop - Cell exploration
                while (!gameState.Wand) {
                    await typeText("What do you do?");

                    print("2. Look at the shelf");

                        print("");

                        print("");
                        print("1. Call out");
                        await sleep(1000);
                        print("2. Go back");
                        
                        const choice2 = await getInput();
                        
                        if (choice2 === "1") {
                            await typeText("You call out down the empty halls and get no response");
                            await sleep(1000);
                            print("");
                            await typeText("You walk back into the cell");
                            print("");
                            await sleep(1000);
                        } else {
                            await typeText("You walk back into the cell");
                            print("");
                            await sleep(1000);
                        }
                    } else if (choice1 === "2") {
                        if (gameState.Razor >= 1) {
                            if (gameState.infinite_razor_counter < 20) {
                                await typeText("You look at the shelf and see nothing of interest, you walk back into the middle of the cell");
                                print("");
                                await sleep(1000);
                                gameState.infinite_razor_counter++;
                            } else {
                                await typeText("You look at the shelf and see another razor identical to the one you picked up earlier");
                                await sleep(1000);
                                print("");
                                await typeText("Are you happy now, Lennon?");
                                await sleep(1000);
                                print("");
                                await typeText("What do you do?");
                                await sleep(1000);
                                print("");
                                print("1. Pick up the razor");
                                await sleep(1000);
                                print("2. Leave it");
                                
                                const choice3 = await getInput();
                                
                                if (choice3 === "1") {
                                    await sleep(1000);
                                    await typeText("You pick up the razor and walk back to the middle of the cell");
                                    print("");
                                    gameState.infinite_razor_counter++;
                                    gameState.Razor++;
                                } else {
                                    await typeText("You leave it and walk back to the middle of the cell");
                                    print("");
                                    gameState.infinite_razor_counter++;
                                }
                            }
                        } else {
                            await typeText("You look at the shelf and see a dull, old style razor");
                            await sleep(1000);
                            print("");
                            await typeText("What do you do?");
                            await sleep(1000);
                            print("");
                            print("1. Pick up the razor");
                            await sleep(1000);
                            print("2. Leave it");
                            
                            const choice3 = await getInput();
                            
                            if (choice3 === "1") {
                                await sleep(1000);
                                await typeText("You pick up the razor and walk back to the middle of the cell");
                                print("");
                                gameState.Razor = 1;
                            } else {
                                await typeText("You leave it and walk back to the middle of the cell");
                                print("");
                            }
                        }
                    } else if (choice1 === "3") {
                        await typeText("You inspect the bed closer and see a compartment hidden under the mattress");
                        print("");
                        await sleep(1000);
                        await typeText("In the compartment you see a stick that tapers near the end, it has complex designs carved into it");
                        print("");
                        await sleep(1000);
                        await typeText("You feel an aura of energy emanating from it and your fingers tingle as you hold it");
                        print("");
                        await sleep(1000);
                        await typeText("You walk back into the middle of the cell");
                        print("");
                        await sleep(1000);
                        gameState.Wand = true;
                    }
                }

                await typeText("You now see a silhouette of a door on the wall next to the bed");
                await sleep(1000);

                // Door puzzle
                while (!gameState.door1) {
                    print("");
                    await typeText("What do you do?");
                    print("");
                    await sleep(1000);
                    print("1. Inspect the silhouette");
                    await sleep(1000);
                    print("2. Inspect the stick");
                    
                    const choice4 = await getInput();
                    
                    if (choice4 === "2") {
                        await typeText("You inspect the stick and see that its designs are reminiscent of those you have seen in drawings of wands in fantasy books");
                        await sleep(1000);
                        print("");
                    } else if (choice4 === "1") {
                        await typeText("You inspect the silhouette and see that there is a small hole within it that would fit the stick");
                        print("");
                        await sleep(1000);
                        await typeText("You stick one end of the stick into the hole, it does not work");
                        print("");
                        await sleep(3000);
                        await typeText("A few seconds later you realize it must be the other side that works, then stick that end in");
                        print("");
                        await sleep(1000);
                        await typeText("The door swings open and you walk through");
                        print("");
                        await sleep(1000);
                        gameState.door1 = true;
                    }
                }

                await typeText("You see a flash of light and your vison goes dark");
                print("");
                await sleep(3000);
                await typeText("You awake from whatever has affected you, you have no idea how long you've been out but it feels as though it has been a while");
                await sleep(1000);
                print("");
                await typeText("You see that you are in a room filled with books and beakers of all sorts, many of the beakers are filled with colorful liquids, while others are empty");
                print("");
                await sleep(1000);

                // Potion room
                while (!gameState.potion1) {
