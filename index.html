<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warden's Sanctum - Text Adventure</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Georgia', serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); color:#e0e0e0; line-height:1.6; min-height:100vh; display:flex; flex-direction:column; transition: background 2s ease; }
@keyframes backgroundShift {
  0% { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); }
  50% { background: linear-gradient(135deg, #16213e 0%, #0f3460 50%, #1a1a2e 100%); }
  100% { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); }
}
body.animate-background { animation: backgroundShift 10s infinite alternate; }
header { text-align:center; padding:40px 20px 20px; }
h1 { font-size:3em; color:#c7a64a; text-shadow:0 0 20px rgba(199,166,74,0.5); margin-bottom:10px; }
.container { flex:1; max-width:1200px; margin:0 auto; padding:20px; display:flex; flex-direction:column; }
#story { background:rgba(0,0,0,0.5); border:2px solid #c7a64a; border-radius:10px; padding:30px; flex:1; overflow-y:auto; margin-bottom:20px; white-space:pre-wrap; opacity:0; animation: fadeIn 1s forwards; }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
.story-line { opacity:0; animation: lineFade 0.8s forwards; }
@keyframes lineFade { from { opacity:0; transform: translateY(5px); } to { opacity:1; transform: translateY(0); } }
#choices { text-align:center; margin-bottom:20px; }
.choice-button { background:linear-gradient(135deg, #c7a64a 0%, #8b7332 100%); color:#1a1a2e; padding:10px 30px; font-size:1.2em; margin:5px; border:none; border-radius:5px; cursor:pointer; transition:all 0.4s ease; opacity:0; transform:translateY(10px); }
.choice-button.show { opacity:1; transform:translateY(0); }
.choice-button:hover { transform:translateY(-3px) scale(1.05); box-shadow:0 5px 15px rgba(199,166,74,0.4); }
#controls { text-align:center; margin-bottom:20px; }
.control-button { background:#c7a64a; color:#1a1a2e; padding:8px 20px; border:none; border-radius:5px; cursor:pointer; margin:0 5px; }
</style>
</head>
<body class="animate-background">
<header>
<h1>Warden's Sanctum</h1>
<p class="tagline">A tale of escape, discovery, and mysterious powers</p>
</header>
<div class="container">
<div id="story"></div>
<div id="choices"></div>
<div id="controls">
<button class="control-button" id="toggleInstant">Toggle Instant Mode</button>
<button class="control-button" id="restart">Restart</button>
</div>
</div>
<script>
const storyEl = document.getElementById('story');
const choicesEl = document.getElementById('choices');
let instantMode = false;

let state = {
    Razor: 0,
    Wand: false,
    door1: false,
    potion1: false,
    timewasted: false,
    scars: false,
    flowers_collected: false,
    water_collected: false,
    infinite_razor_counter: 0,
    powerupgraded: 0
};

async function typeText(text, delay=20) {
    const line = document.createElement('div');
    line.className = 'story-line';
    storyEl.appendChild(line);

    if (instantMode) {
        line.textContent = text;
        storyEl.scrollTop = storyEl.scrollHeight;
        line.classList.add('show');
        return;
    }

    for (let char of text) {
        line.textContent += char;
        storyEl.scrollTop = storyEl.scrollHeight;
        await new Promise(r => setTimeout(r, delay));
    }
    line.classList.add('show');
}

function setChoices(options) {
    choicesEl.innerHTML = '';
    options.forEach((opt,i) => {
        const btn = document.createElement('button');
        btn.className = 'choice-button';
        btn.textContent = opt.text;
        btn.onclick = () => opt.action();
        choicesEl.appendChild(btn);
        setTimeout(() => btn.classList.add('show'), i*100); // staggered animation
    });
}

// The game logic functions (startGame, cellScene, doorScene, labScene, etc.) remain unchanged
// Copy the previous HTML game script here (omitted in this snippet for brevity, use the previous full script)

document.getElementById('toggleInstant').onclick = () => { instantMode = !instantMode; };
document.getElementById('restart').onclick = startGame;

startGame();
</script>
</body>
</html>
